# https://github.com/rafo/aerc-vim/blob/main/binds.conf

# Binds are of the form <key sequence> = <command to run>
# To use '=' in a key sequence, substitute it with "Eq": "<Ctrl+Eq>"
# If you wish to bind #, you can wrap the key sequence in quotes: "#" = quit

# GLOBAL BINDINGS
<C-i> = <Tab>
<C-m> = <Enter>
<C-[> = <Esc>

<C-t> = :term<Enter>
? = :help keys<Enter>
# IMPROVED: Prompt before quitting instead of force quit
ZZ = :prompt 'Quit? ' quit<Enter>
Q = :quit<Enter>
<C-z> = :suspend<Enter>

# Tab navigation (Vim-style)
gt = :next-tab<Enter>
gT = :prev-tab<Enter>

# =====================================================================
# MESSAGE LIST
[messages]

# Filters
# -------
fi = :filter<space> # start filter and show flags
fa = :filter -a<space> # filter all text of mails. e.g. "fa foo" filters mails containing "foo" in the entire mail.
fb = :filter -b<Enter> # filter mails' body contents
# Subject
fs = :filter -H<space> subject: # filter mails with subject
fS = :filter -H<space> subject:"{{.SubjectBase}}" <Enter> # filter mails with the same subject
# Read and Unread
fr = :filter -r<Enter> # filter read mails (old mails)
fu = :filter -u<Enter> # filter unread mails (new mails)
# From and To
ff = :filter -f<space> "{{index (.From | emails) 0}}" <Enter> # filter mails from current sender
fF = :filter -f<space> # filter mails from sender
ft = :filter -t<space> # filter mails to recipient
fT = :filter -t<space> "{{index (.To | emails) 0}}" <Enter> # filter mails to current recipient

# Spam reporting
rs = :forward -F -s spamreport@posteo.de<Enter> # Report Spam as attachment

# Repeats last binding
. = :repeat<Enter>

# Navigation (Vim-style)
j = :next<Enter>
<C-d> = :next 50%<Enter>
<C-f> = :next 100%<Enter>

k = :prev<Enter>
<C-u> = :prev 50%<Enter>
<C-b> = :prev 100%<Enter>

gg = :select 0<Enter>
G = :select -1<Enter>

# Folder and tab navigation
K = :prev-folder<Enter>
J = :next-folder<Enter>
H = :prev-tab<Enter>
L = :next-tab<Enter>

# Mark modes
v = :mark -t<Enter>
<Space> = :mark -t<Enter>:next<Enter>
V = :mark -V<Enter>   # Mark without clearing existing selection
U = :unmark -a<Enter>
# IMPROVED: Better visual mode
vv = :mark -v<Enter>  # Enter/leave visual mark mode
va = :mark -a<Enter>  # Mark all mails
vt = :mark -t<Enter>  # Toggle mark state
vT = :mark -T<Enter>  # Mark thread

# Thread folding
t = :toggle-threads<Enter>
zc = :fold<Enter>
zo = :unfold<Enter>
za = :fold -t<Enter>
zM = :fold -a<Enter>
zR = :unfold -a<Enter>
# IMPROVED: Folder collapse/expand
zC = :collapse-folder<Enter>
zO = :expand-folder<Enter>
<tab> = :fold -t<Enter>

# View alignment
zz = :align center<Enter>
zt = :align top<Enter>
zb = :align bottom<Enter>

# Reading and viewing
<Enter> = :view<Enter>
<C-m> = :view<Enter>
l = :view<Enter>
d = :read<Enter>:move Trash<Enter> # mark as read and move to trash
a = :read<Enter>:archive flat<Enter> # mark as read and archive
A = :unmark -a<Enter>:mark -T<Enter>:read<Enter>:archive flat<Enter> # mark thread as read and archive

# IMPROVED: Add permanent delete (be careful with this)
dd = :delete<Enter>
x = :delete<Enter>    # Alternative delete binding

b = :pipe -m aba parse --from  # add :from to address-Book, (https://sr.ht/~onemoresuza/aba)

# Move/Copy mail
mv = :mv<space> # Move mail to folder
# IMPROVED: Copy to folder (yank/paste thinking)
yy = :copy<space> # Copy mail to folder
# IMPROVED: Copy email metadata
yf = :pipe -b echo "{{index (.From | emails) 0}}" | xclip -selection clipboard # Copy sender email
ys = :pipe -b echo "{{.Subject}}" | xclip -selection clipboard # Copy subject
yd = :pipe -b echo "{{.Date}}" | xclip -selection clipboard # Copy date
# Note: Replace 'xclip' with 'pbcopy' on macOS

# Compose modes
# IMPROVED: Multiple keys for compose (E, e, i, o like Vim line insertion)
co = :compose<Enter>
C = :compose<Enter>
E = :compose<Enter>
i = :compose<Enter>
cO = :compose -H 'To:{{.To | persons | join ", "}}'<Enter>  # compose to All
ea = :reply -a<Enter> # reply to all
eF = :forward -a<Enter> # forward to all recipients
ef = :forward<Enter>  # forward

# Read/Unread
re = :read<Enter>
ur = :unread<Enter>
mu = :unread<Enter>   # Alternative mnemonic (mark unread)

# Reply modes (improved mnemonic)
rr = :reply -a<Enter>
rq = :reply -aq<Enter>
Rr = :reply<Enter>
Rq = :reply -q<Enter>

# Patch management
pl = :patch list<Enter>
pa = :patch apply <Tab>
pd = :patch drop <Tab>
pb = :patch rebase<Enter>
pt = :patch term<Enter>
ps = :patch switch <Tab>

# Directory and terminal
cd = :cd<space>  # change file system's working directory
$ = :term<space>
! = :term<space>
| = :pipe<space>

# Search
/ = :search<space>
\ = :filter<space>
n = :next-result<Enter>
N = :prev-result<Enter>
<Esc> = :clear<Enter>
q = :clear<Enter>

# Split views
s = :split<Enter>
S = :vsplit<Enter>

# IMPROVED: Folder-specific bindings with shortcuts
gf = :menu -adc fzf :cf -a<Enter>  # go to folder (fzf menu)

# =====================================================================
# MESSAGES - SPECIFIC FOLDERS
[messages:folder=Drafts]
<Enter> = :recall<Enter>

[messages:folder=Spam-Log]
d = :delete<Enter>
x = :delete<Enter>

[messages:folder=Spam]
d = :delete<Enter>
x = :delete<Enter>

[messages:folder=Trash]
d = :delete<Enter>
x = :delete<Enter>

# =====================================================================
# VIEWING MESSAGES
[view]
a = :archive flat
b = :pipe -m aba parse --from  # add :from to address-book, https://sr.ht/~onemoresuza/aba/
/ = :toggle-key-passthrough<Enter>/
q = :close<Enter>
O = :open<Enter>
S = :save<space>
| = :pipe<space>
d = :move Trash<Enter>
x = :delete<Enter>    # IMPROVED: Add alternate delete
D = :pipe gpg --decrypt<Enter>  # decrypt
gpgd = :pipe gpg --decrypt<Enter>  # decrypt
gpgi = :pipe -p gpg --import  # import key (select it first)

<C-y> = :copy-link <space>
<C-o> = :open-link <space>

# IMPROVED: Copy metadata in view
yf = :pipe -b echo "{{index (.From | emails) 0}}" | xclip -selection clipboard # Copy sender
ys = :pipe -b echo "{{.Subject}}" | xclip -selection clipboard # Copy subject
yd = :pipe -b echo "{{.Date}}" | xclip -selection clipboard # Copy date

o = <Esc>M<Enter> # open link in firefox (<Esc>M is an w3m binding)

# Forward and reply
F = :forward<Enter>
f = :forward<Enter>   # IMPROVED: Add lowercase mnemonic
rs = :forward -F spamreport@posteo.de<Enter> # Report Spam
rr = :reply -a<Enter>
rq = :reply -aq<Enter>
Rr = :reply<Enter>
Rq = :reply -q<Enter>

# Part navigation
<C-k> = :prev-part<Enter>
<C-j> = :next-part<Enter>
J = :next<Enter>
K = :prev<Enter>
# IMPROVED: Tab navigation in view
H = :prev-tab<Enter>
L = :next-tab<Enter>

[view::passthrough]
$noinherit = true
$ex = <C-x>
<Esc> = :toggle-key-passthrough<Enter>

# =====================================================================
# COMPOSING MESSAGES
[compose]
# Keybindings used when the embedded terminal is not selected in the compose view
$noinherit = true
$ex = <C-x>
$complete = <C-o>
<C-k> = :prev-field<Enter>
<C-j> = :next-field<Enter>
<C-h> = :prev-tab<Enter>
<C-l> = :next-tab<Enter>
# IMPROVED: Add account switching
<A-h> = :switch-account -p<Enter>
<A-l> = :switch-account -n<Enter>
# IMPROVED: Tab/Shift-Tab for field navigation
<backtab> = :prev-field<Enter>
<tab> = :next-field<Enter>
<C-a> = :menu -c 'fd . --type=f | fzf -m' attach<Enter> # Attach files with fzf

[compose::editor]
# Keybindings used when the embedded terminal is selected in the compose view
$noinherit = true
$ex = <C-x>
<C-k> = :prev-field<Enter>
<C-j> = :next-field<Enter>
<C-h> = :prev-tab<Enter>
<C-l> = :next-tab<Enter>
<C-a> = :menu -c 'fd . --type=f | fzf -m' attach<Enter> # Attach files with fzf

[compose::review]
# Keybindings used when reviewing a message to be sent
$noinherit = true
# IMPROVED: More intuitive send/abort bindings
y = :send<Enter>           # Send (Y for yes)
s = :send<Enter>           # Send (s for send)
w = :send<Enter>           # Send (w for write/save)
n = :postpone<Enter>       # No - postpone
N = :abort<Enter>          # No - discard (capital N for destructive)
q = :abort<Enter>          # Quit without sending
# IMPROVED: More safety with ZZ instead of direct abort
ZZ = :abort<Enter>         # Quit safely
<C-a> = :menu -c 'fd . --type=f | fzf -m' attach<Enter> # Attach files with fzf
<C-d> = :detach<space>     # Remove attachment
c = :edit<Enter>           # Continue editing
e = :edit<Enter>           # Edit
e = :encrypt<Enter>        # Toggle encryption to all recipients
E = :sign<Enter>:encrypt<Enter> # Toggle sign and encryption
s = :sign<Enter>           # Toggle signing
v = :preview<Enter>        # Preview message
p = :postpone<Enter>       # Postpone
d = :discard<Enter>        # Discard (temporary)

# =====================================================================
# TERMINAL
[terminal]
$noinherit = true
$ex = <C-x>

<C-h> = :prev-tab<Enter>
<C-l> = :next-tab<Enter>
