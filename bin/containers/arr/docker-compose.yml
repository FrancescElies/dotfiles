# Create host folders first:
#   mkdir ~/arr/config/{bazarr,lidarr,radarr,readarr,qbittorrent,downloads}
# Build and run all services (podman):
#   podman compose up -d --build
# Stop:
#   podman compose down
services:
  bazarr:
    build: ./bazarr
    container_name: bazarr
    ports:
      - 6767:6767
    volumes:
      - ~/arr/config/bazarr:/config
      - ~/arr/media:/data/media
    restart: unless-stopped

  radarr:
    build: ./radarr
    container_name: radarr
    ports:
      - 7878:7878
    volumes:
      - ~/arr/.config/radarr:/config
      - ~/arr/media:/data/media
    restart: unless-stopped

  readarr:
    build: ./readarr
    container_name: readarr
    ports:
      - 8787:8787
    volumes:
      - ~/arr/.config/readarr:/config
      - ~/arr/media:/data/media
    restart: unless-stopped

  qbittorrent:
    build: ./qbittorrent
    container_name: qbittorrent
    ports:
      - 8080:8080
      - 6881:6881
      - 6881:6881/udp
    volumes:
      - ~/arr/.config/qbittorrent:/config
      - ~/arr/downloads:/data/downloads
    restart: unless-stopped
