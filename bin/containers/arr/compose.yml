# Create host folders first:
#   mkdir /media/cesc/data/arr/config/{bazarr,lidarr,radarr,readarr,qbittorrent,downloads}
# Build and run all services (podman):
#   podman compose up -d --build
# Stop:
#   podman compose down
services:
  bazarr:
    build:
      context: ./bazarr
      dockerfile: Containerfile
    container_name: bazarr
    ports:
      - 127.0.0.1:6767:6767
    volumes:
      - /media/cesc/data/arr/config/bazarr:/config
      - /media/cesc/data/arr/media:/data/media
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - arr
    restart: unless-stopped

  radarr:
    build:
      context: ./radarr
      dockerfile: Containerfile
    container_name: radarr
    ports:
      - 127.0.0.1:7878:7878
    volumes:
      - /media/cesc/data/arr/config/radarr:/config
      - /media/cesc/data/arr/media:/data/media
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - arr
    restart: unless-stopped

  readarr:
    build:
      context: ./readarr
      dockerfile: Containerfile
    container_name: readarr
    ports:
      - 127.0.0.1:8787:8787
    volumes:
      - /media/cesc/data/arr/config/readarr:/config
      - /media/cesc/data/arr/media:/data/media
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - arr
    restart: unless-stopped

  qbittorrent:
    build:
      context: ./qbittorrent
      dockerfile: Containerfile
    container_name: qbittorrent
    ports:
      - 127.0.0.1:8080:8080
      - 6881:6881
      - 6881:6881/udp
    volumes:
      - /media/cesc/data/arr/config/qbittorrent:/config
      - /media/cesc/data/arr/downloads:/data/downloads
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - arr
    restart: unless-stopped

networks:
  arr:
    driver: bridge
