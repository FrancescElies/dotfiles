# Create host folders first:
#   mkdir -p /media/cesc/data/arr/config/{bazarr,lidarr,radarr,readarr,prowlarr,qbittorrent,downloads,media}
# Build and run all services (podman):
#   podman compose up -d --build
# Stop:
#   podman compose down
services:
  bazarr:  # https://github.com/linuxserver/docker-bazarr
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    environment: [PUID=1000, PGID=1000, TZ=UTC]
    ports: ["127.0.0.1:6767:6767"]
    volumes:
      - /media/cesc/data/arr/config/bazarr:/config
      - /media/cesc/data/arr/media:/data/media
    security_opt: [no-new-privileges:true]
    networks: [arr]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:6767/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  radarr:  # https://github.com/linuxserver/docker-radarr
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment: [PUID=1000, PGID=1000, TZ=UTC]
    ports: ["127.0.0.1:7878:7878"]
    volumes:
      - /media/cesc/data/arr/config/radarr:/config
      - /media/cesc/data/arr/media:/data/media
      - /media/cesc/data/arr/downloads:/data/downloads
    security_opt: [no-new-privileges:true]
    networks: [arr]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7878/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # readarr:  # deprecated/stalled; uncomment to enable
  #   image: ghcr.io/hotio/readarr:release
  #   container_name: readarr
  #   environment: [PUID=1000, PGID=1000, TZ=UTC]
  #   ports: ["127.0.0.1:8787:8787"]
  #   volumes:
  #     - /media/cesc/data/arr/config/readarr:/config
  #     - /media/cesc/data/arr/media:/data/media
  #     - /media/cesc/data/arr/downloads:/data/downloads
  #   security_opt: [no-new-privileges:true]
  #   networks: [arr]
  #   restart: unless-stopped

  lidarr:  # https://github.com/linuxserver/docker-lidarr
    image: lscr.io/linuxserver/lidarr:latest
    container_name: lidarr
    environment: [PUID=1000, PGID=1000, TZ=UTC]
    ports: ["127.0.0.1:8686:8686"]
    volumes:
      - /media/cesc/data/arr/config/lidarr:/config
      - /media/cesc/data/arr/media:/data/media
      - /media/cesc/data/arr/downloads:/data/downloads
    security_opt: [no-new-privileges:true]
    networks: [arr]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8686/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  prowlarr:  # https://github.com/linuxserver/docker-prowlarr
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    ports: ["127.0.0.1:9696:9696"]
    environment: [PUID=1000, PGID=1000, TZ=UTC]
    volumes:
      - /media/cesc/data/arr/config/prowlarr:/config
    security_opt: [no-new-privileges:true]
    networks: [arr]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9696/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  flaresolverr:  # https://github.com/FlareSolverr/FlareSolverr
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    ports: ["127.0.0.1:8191:8191"]
    environment: [LOG_LEVEL=info]
    security_opt: [no-new-privileges:true]
    networks: [arr]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8191/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  qbittorrent:  # https://github.com/linuxserver/docker-qbittorrent
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment: [PUID=1000, PGID=1000, TZ=UTC, WEBUI_PORT=8081]
    ports:
      - "127.0.0.1:8081:8081"
      - "6881:6881"
      - "6881:6881/udp"
    volumes:
      - /media/cesc/data/arr/config/qbittorrent:/config
      - /media/cesc/data/arr/downloads:/data/downloads
    security_opt: [no-new-privileges:true]
    networks: [arr]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/ >/dev/null 2>&1 && nc -z localhost 6881"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  arr:
    driver: bridge
# Notes:
# - qBittorrent categories: create categories 'radarr', 'lidarr', 'readarr' pointing at /data/downloads/<name>
# - Atomic moves: keep downloads+media on same FS (both under /media/cesc/data/arr); set arr download client path /data/downloads
# - Prowlarr -> add apps (Radarr/Lidarr/Readarr) via http://radarr:7878 etc; point indexers needing FlareSolverr at http://flaresolverr:8191
# - Popular trackers/indexers to add in Prowlarr: 1337x, RARBG (if up), The Pirate Bay, EZTV, YTS, plus private trackers via FlareSolverr
# TODO: add gluetun service and route qbittorrent network_mode through it for VPN
