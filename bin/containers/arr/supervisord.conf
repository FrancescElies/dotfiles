[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log

[program:radarr]
command=/usr/bin/dotnet /opt/radarr/Radarr.Console.dll
autorestart=true

[program:lidarr]
command=/usr/bin/dotnet /opt/lidarr/Lidarr.Console.dll
autorestart=true

[program:readarr]
command=/usr/bin/dotnet /opt/readarr/Readarr.Console.dll
autorestart=true

[program:bazarr]
command=/opt/bazarr/venv/bin/python /opt/bazarr/bazarr.py
autorestart=true

[program:qbittorrent]
command=/usr/bin/qbittorrent-nox --webui-port=8080
autorestart=true